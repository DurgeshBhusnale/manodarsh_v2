[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --maxfail=5
    -ra
    --color=yes

# Coverage configuration
[coverage:run]
source = services,api
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Pytest markers
markers =
    unit: Unit tests with mocked dependencies (fast)
    integration: Integration tests with real dependencies (slower)
    hardware: Tests requiring real camera/hardware (manual)
    slow: Tests that take > 1 second
    api: API endpoint tests
    database: Database tests
    ai: AI model tests
    security: Security tests
    performance: Performance benchmarking tests
    e2e: End-to-end browser tests

# Test timeout (prevents hanging tests)
timeout = 30
timeout_method = thread

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
